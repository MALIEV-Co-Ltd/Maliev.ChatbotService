name: Dependency Review

on:
  pull_request:
    branches:
      - develop
      - main
      - staging

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
          source-url: https://nuget.pkg.github.com/MALIEV-Co-Ltd/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITOPS_PAT }}

      - name: Switch to PackageReference for CI
        run: |
          for file in $(find . -name "*.csproj"); do
            sed -i 's|<ProjectReference Include=".*Maliev.Aspire.ServiceDefaults.*.csproj" />|<PackageReference Include="Maliev.Aspire.ServiceDefaults" Version="1.0.*" />|g' "$file"
          done

      - name: Restore dependencies
        run: dotnet restore Maliev.ChatbotService.sln
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITOPS_PAT }}
        continue-on-error: true

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
