name: Dependency Review

on:
  pull_request:
    branches:
      - develop
      - main
      - staging

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
          source-url: https://nuget.pkg.github.com/MALIEV-Co-Ltd/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITOPS_PAT }}

      - name: Restore dependencies
        run: dotnet restore Maliev.ChatbotService.slnx
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITOPS_PAT }}
        continue-on-error: true

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
