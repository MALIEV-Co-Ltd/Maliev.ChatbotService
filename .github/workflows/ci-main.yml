name: CI - Production

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Switch to PackageReference for CI
        run: |
          # Replace ProjectReference with PackageReference in all service csproj files
          for file in $(find . -name "*.csproj"); do
            sed -i 's|<ProjectReference Include=".*Maliev.Aspire.ServiceDefaults.*.csproj" />|<PackageReference Include="Maliev.Aspire.ServiceDefaults" Version="1.0.*" />|g' "$file"
          done
          echo "Switched to PackageReference for ServiceDefaults"

      - name: Restore dependencies
        run: dotnet restore Maliev.ChatbotService.sln
        env:
          NUGET_USERNAME: ${{ github.actor }}
          NUGET_PASSWORD: ${{ secrets.GITOPS_PAT }}

      - name: Build solution
        run: dotnet build Maliev.ChatbotService.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Maliev.ChatbotService.sln --no-build --configuration Release --verbosity normal
        # Testcontainers will automatically spin up PostgreSQL, Redis, and RabbitMQ
        # No manual connection strings allowed - tests must use Testcontainers infrastructure

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: maliev-website

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          NUGET_USERNAME=${{ github.actor }} NUGET_PASSWORD=${{ secrets.GITOPS_PAT }} docker build --secret id=nuget_username,env=NUGET_USERNAME --secret id=nuget_password,env=NUGET_PASSWORD -t asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-prod/maliev-chatbot-service:${{ github.sha }} -f Maliev.ChatbotService.Api/Dockerfile .
          docker push asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-prod/maliev-chatbot-service:${{ github.sha }}

      - name: Checkout maliev-gitops repository
        uses: actions/checkout@v5
        with:
          repository: MALIEV-Co-Ltd/maliev-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: maliev-gitops

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tag in maliev-gitops using Kustomize
        run: |
          cd maliev-gitops/3-apps/maliev-chatbot-service/overlays/production
          kustomize edit set image \
            asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-prod/maliev-chatbot-service=asia-southeast1-docker.pkg.dev/maliev-website/maliev-website-artifact-prod/maliev-chatbot-service:${{ github.sha }}

      - name: Create Pull Request to maliev-gitops
        run: |
          cd maliev-gitops
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Create feature branch
          BRANCH_NAME="update-chatbot-service-prod-${{ github.sha }}"
          git checkout -b "$BRANCH_NAME"

          git add .
          git commit -m "chore(prod): Update ChatbotService image to ${{ github.sha }}" \
                     -m "Automated deployment from main branch" \
                     -m "Commit: ${{ github.sha }}" \
                     -m "Ref: ${{ github.ref }}"

          git push origin "$BRANCH_NAME"

          # Create PR using GitHub CLI
          echo "${{ secrets.GITOPS_PAT }}" | gh auth login --with-token
          gh pr create \
            --repo MALIEV-Co-Ltd/maliev-gitops \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(prod): Update ChatbotService to ${{ github.sha }}" \
            --body "Automated GitOps Update - PRODUCTION - Service: ChatbotService, Environment: Production, Image Tag: ${{ github.sha }}, Source Branch: main, Commit: ${{ github.sha }}. Updates maliev-chatbot-service image in production overlay. WARNING: PRODUCTION DEPLOYMENT - This PR was automatically created by GitHub Actions. Once merged, ArgoCD will automatically sync the changes to the maliev-prod namespace. Triggered by: ${{ github.actor }}, Workflow: ${{ github.workflow }}, Run: ${{ github.run_id }}. APPROVAL REQUIRED: This is a production deployment and should be reviewed before merging."